<!doctype html><meta charset="utf-8"><body><script type="module">
import * as ocr from '../../js/ocr.js';
const now = new Date(2026, 10, 23);
async function load(id, ext = 'png') {
  const img = new Image(); img.src = `./img/${id}.${ext}`; await img.decode();
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0); return c;
}
window.runBench = async (mode) => {
  const meta = await (await fetch(mode === 'whole' ? './img/whole.json' : './img/meta.json')).json();
  await ocr.getWorker();
  const out = [];
  for (const m of meta) {
    const c = await load(m.id, m.ext); const t0 = performance.now();
    const r = await ocr.readDatesFrom(c, { now, whole: mode === 'whole' });
    const fmt = (e) => `${e.d ? String(e.d).padStart(2, '0') : '-'}/${String(e.m).padStart(2, '0')}/${e.y}`;
    const got = r.candidates.map((x) => fmt(x.exp));
    out.push({ id: m.id, expect: m.expect, top: got[0] || null, inList: got.includes(m.expect), all: got.slice(0, 3), ms: Math.round(performance.now() - t0), text: r.texts.join(' || ').replace(/\n/g, ' ⏎ ').slice(0, 160) });
  }
  return out;
};
window.benchReady = true;
</script>
